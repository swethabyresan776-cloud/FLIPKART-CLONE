<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist | Flipkart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Roboto', sans-serif; background: #f1f3f6; color: #212121; }
      .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .topbar { background: #2874f0; color: white; padding: 16px 0; }
      .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .logo { font-size: 2rem; font-weight: 700; letter-spacing: -0.06em; }
      .sub { font-size: 0.72rem; color: #ffe500; }
      .panel { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 20px; margin-top: 24px; }
      .wishlist-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #eee; }
      .item-details { display: flex; align-items: center; gap: 16px; }
      .item-details img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; }
      .price { font-weight: 700; }
      .actions { display: flex; gap: 12px; align-items: center; }
      .actions button { border: none; border-radius: 4px; padding: 8px 12px; font-weight: 700; cursor: pointer; }
      .move-btn { background: #2874f0; color: white; }
      .remove-btn { background: #f6f6f6; color: #333; }
      .empty-state { padding: 28px 0; color: #666; }
      a.back-link { color: #2874f0; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div>
          <div class="logo">Flipkart</div>
          <div class="sub">Explore Plus</div>
        </div>
        <a href="/" style="color: white; font-weight: 700; text-decoration: none;">Back to Home</a>
      </div>
    </header>

    <div class="container">
      <div class="panel">
        <h2 style="margin-bottom: 14px;">My Wishlist</h2>
        <div id="wishlistItems"></div>
      </div>
    </div>

    <script>
      const WISHLIST_KEY = 'flipkart-wishlist';
      const CART_KEY = 'flipkart-cart';

      const getWishlist = () => {
        try {
          return JSON.parse(localStorage.getItem(WISHLIST_KEY) || '[]');
        } catch (error) {
          return [];
        }
      };

      const saveWishlist = (wishlist) => {
        localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
      };

      const getCart = () => {
        try {
          return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        } catch (error) {
          return [];
        }
      };

      const saveCart = (cart) => {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
      };

      const renderWishlist = () => {
        const wishlist = getWishlist();
        const wishlistItems = document.getElementById('wishlistItems');

        if (!wishlist.length) {
          wishlistItems.innerHTML = '<div class="empty-state">Your wishlist is empty. <a href="/" class="back-link">Continue shopping</a></div>';
          return;
        }

        wishlistItems.innerHTML = wishlist.map((item) => `
          <div class="wishlist-item">
            <div class="item-details">
              <img src="${item.image || 'https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=300&q=80'}" alt="${item.name}" />
              <div>
                <h4>${item.name}</h4>
                <div class="price">₹${Number(item.price || 0).toLocaleString('en-IN')}</div>
              </div>
            </div>
            <div class="actions">
              <button class="move-btn" data-id="${item.id}">Move to Cart</button>
              <button class="remove-btn" data-remove-id="${item.id}">Remove</button>
            </div>
          </div>
        `).join('');

        document.querySelectorAll('[data-id]').forEach((button) => {
          button.addEventListener('click', () => {
            const id = Number(button.dataset.id);
            const cart = getCart();
            const item = getWishlist().find((entry) => entry.id === id);

            if (!item) return;

            const existing = cart.find((entry) => entry.id === id);
            if (existing) {
              existing.quantity += 1;
            } else {
              cart.push({ ...item, quantity: 1 });
            }

            saveCart(cart);
            const updatedWishlist = getWishlist().filter((entry) => entry.id !== id);
            saveWishlist(updatedWishlist);
            renderWishlist();
          });
        });

        document.querySelectorAll('[data-remove-id]').forEach((button) => {
          button.addEventListener('click', () => {
            const id = Number(button.dataset.removeId);
            const updatedWishlist = getWishlist().filter((entry) => entry.id !== id);
            saveWishlist(updatedWishlist);
            renderWishlist();
          });
        });
      };

      renderWishlist();
    </script>
  </body>
</html>
