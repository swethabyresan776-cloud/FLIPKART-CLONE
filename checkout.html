<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | CartZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Roboto', sans-serif; background: #f1f3f6; color: #212121; }
      .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
      .topbar { background: #2874f0; color: white; padding: 16px 0; }
      .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .logo { font-size: 2rem; font-weight: 700; letter-spacing: -0.06em; }
      .sub { font-size: 0.72rem; color: #ffe500; }
      .checkout-layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-top: 24px; }
      .panel, .summary-box { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 20px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .field { display: flex; flex-direction: column; gap: 8px; }
      .field.full { grid-column: 1 / -1; }
      input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
      .summary-row { display: flex; justify-content: space-between; margin: 12px 0; }
      .checkout-btn { width: 100%; background: #fb641b; color: white; border: none; border-radius: 6px; padding: 14px 20px; font-weight: 700; cursor: pointer; margin-top: 18px; }
      a.back-link { color: #2874f0; text-decoration: none; font-weight: 700; }
      .empty-state { color: #666; padding: 28px 0; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div>
          <div class="logo">CartZone</div>
          <div class="sub">Explore Plus</div>
        </div>
        <a href="/cart.html" style="color: white; font-weight: 700; text-decoration: none;">Back to Cart</a>
      </div>
    </header>

    <div class="container">
      <div class="checkout-layout">
        <div class="panel">
          <h2 style="margin-bottom: 18px;">Delivery Details</h2>
          <form id="checkoutForm">
            <div class="form-grid">
              <div class="field">
                <label>Full Name</label>
                <input type="text" id="fullName" value="John Doe" required />
              </div>
              <div class="field">
                <label>Phone</label>
                <input type="tel" id="phone" value="9876543210" required />
              </div>
              <div class="field full">
                <label>Address</label>
                <textarea id="address" rows="3" required>123 Main Street, Bengaluru</textarea>
              </div>
              <div class="field">
                <label>City</label>
                <input type="text" id="city" value="Bengaluru" required />
              </div>
              <div class="field">
                <label>Pin Code</label>
                <input type="text" id="pincode" value="560001" required />
              </div>
              <div class="field full">
                <label>Payment Method</label>
                <select id="paymentMethod">
                  <option>UPI</option>
                  <option>Debit Card</option>
                  <option>Credit Card</option>
                  <option>Cash on Delivery</option>
                </select>
              </div>
            </div>
            <button type="submit" class="checkout-btn">Proceed to Pay</button>
          </form>
        </div>

        <aside class="summary-box">
          <h3>Order Summary</h3>
          <div id="checkoutItems" class="empty-state">Loading...</div>
          <div class="summary-row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div>
          <div class="summary-row"><span>Delivery</span><strong>Free</strong></div>
          <div class="summary-row"><span>Total</span><strong id="total">₹0</strong></div>
        </aside>
      </div>
    </div>

    <script>
      const CART_KEY = 'flipkart-cart';

      const getCart = () => {
        try {
          return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        } catch (error) {
          return [];
        }
      };

      const saveCart = (cart) => {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
      };

      const renderCheckoutSummary = () => {
        const cart = getCart();
        const subtotalEl = document.getElementById('subtotal');
        const totalEl = document.getElementById('total');
        const checkoutItems = document.getElementById('checkoutItems');

        if (!cart.length) {
          checkoutItems.innerHTML = '<div class="empty-state">Your cart is empty. <a href="/" class="back-link">Go shopping</a></div>';
          subtotalEl.textContent = '₹0';
          totalEl.textContent = '₹0';
          return;
        }

        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const orderMeta = JSON.parse(localStorage.getItem('flipkart-order-meta') || '{}');
        const discount = Number(orderMeta.discount || 0);
        const total = Number(orderMeta.total || subtotal);

        checkoutItems.innerHTML = cart.map((item) => `
          <div style="display:flex; justify-content:space-between; margin:10px 0; gap:10px;">
            <span>${item.name} × ${item.quantity}</span>
            <strong>₹${(item.price * item.quantity).toLocaleString('en-IN')}</strong>
          </div>
        `).join('');

        subtotalEl.textContent = `₹${subtotal.toLocaleString('en-IN')}`;
        totalEl.textContent = `₹${total.toLocaleString('en-IN')}`;

        const summaryBox = document.querySelector('.summary-box');
        const existingDiscountLine = summaryBox?.querySelector('[data-discount-row="true"]');
        if (existingDiscountLine) existingDiscountLine.remove();

        const discountLine = document.createElement('div');
        discountLine.className = 'summary-row';
        discountLine.setAttribute('data-discount-row', 'true');
        discountLine.innerHTML = '<span>Discount</span><strong>-₹' + discount.toLocaleString('en-IN') + '</strong>';
        summaryBox?.appendChild(discountLine);
      };

      document.getElementById('checkoutForm')?.addEventListener('submit', (event) => {
        event.preventDefault();
        const cart = getCart();

        if (!cart.length) {
          alert('Your cart is empty.');
          return;
        }

        const orderMeta = JSON.parse(localStorage.getItem('flipkart-order-meta') || '{}');
        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const discount = Number(orderMeta.discount || 0);
        const total = Number(orderMeta.total || (subtotal - discount));

        localStorage.setItem('flipkart-last-order', JSON.stringify({
          items: cart,
          subtotal,
          discount,
          total,
          customer: {
            name: document.getElementById('fullName').value,
            city: document.getElementById('city').value,
            payment: document.getElementById('paymentMethod').value
          }
        }));

        saveCart([]);
        window.location.href = '/order-confirmation.html';
      });

      renderCheckoutSummary();
    </script>
  </body>
</html>
