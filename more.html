<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More | CartZone</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .more-hero { padding: 36px 0; text-align: center; }
      .more-list { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
      .more-card { background:#fff;padding:14px 18px;border-radius:10px;box-shadow:var(--shadow); min-width:200px; }
    </style>
  </head>
  <body>
    <header class="page-header" style="position:static;">
      <div class="top-strip">
        <div class="container nav-wrap" style="padding:12px 0; display:flex; align-items:center; justify-content:space-between;">
          <div class="brand-logo-wrap">
            <span class="brand-logo">CartZone</span>
            <span class="explore-plus">Explore <span>Plus</span></span>
          </div>
          <a href="index.html" style="color:#fff; text-decoration:none; background:var(--fk-blue); padding:8px 12px; border-radius:4px;">Back to Home</a>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="more-hero">
        <h1>More from CartZone</h1>
        <p>Quick links and helpful pages.</p>
      </section>

      <section class="more-list">
        <div class="more-card"><a href="#">Gift Cards</a></div>
        <div class="more-card"><a href="#" data-modal="contact">Affiliate Program</a></div>
        <div class="more-card"><a href="#" data-modal="contact">Careers</a></div>
        <div class="more-card"><a href="#" data-modal="contact">Corporate Orders</a></div>
      </section>

      <!-- Contact modal -->
      <div id="contactModal" class="modal hidden" aria-hidden="true" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="background:rgba(0,0,0,0.5);position:absolute;inset:0;" data-close="true"></div>
        <div style="background:#fff;border-radius:10px;padding:18px;min-width:320px;max-width:560px;position:relative;box-shadow:var(--shadow);">
          <button id="closeModal" style="position:absolute;right:12px;top:12px;border:none;background:transparent;font-size:18px;cursor:pointer;">✕</button>
          <h3>Contact Us</h3>
          <form id="contactForm" style="display:grid;gap:8px;margin-top:8px;">
            <input id="contactName" placeholder="Your name" required style="padding:10px;border:1px solid #ddd;border-radius:6px;" />
            <input id="contactEmail" type="email" placeholder="Email" required style="padding:10px;border:1px solid #ddd;border-radius:6px;" />
            <textarea id="contactMessage" rows="4" placeholder="How can we help?" style="padding:10px;border:1px solid #ddd;border-radius:6px;"></textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
              <button type="button" id="cancelContact" style="background:#f1f3f6;border:1px solid #ddd;padding:8px 12px;border-radius:6px;">Cancel</button>
              <button type="submit" style="background:var(--fk-blue);color:#fff;border:none;padding:8px 12px;border-radius:6px;">Send</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
