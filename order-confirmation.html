<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Confirmed | CartZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Roboto', sans-serif; background: #f1f3f6; color: #212121; }
      .container { max-width: 900px; margin: 60px auto; padding: 24px; }
      .card { background: #fff; padding: 36px 28px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08); text-align: center; }
      .success { color: #27ae60; font-size: 3rem; margin-bottom: 16px; }
      h1 { font-size: 2rem; margin-bottom: 12px; }
      p { color: #555; margin-bottom: 10px; line-height: 1.6; }
      .btn { display: inline-block; margin-top: 22px; background: #2874f0; color: white; border: none; border-radius: 6px; padding: 12px 24px; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="success">✓</div>
        <h1>Order Confirmed</h1>
        <p>Your order has been placed successfully.</p>
        <p id="orderMeta">Thank you for shopping with us.</p>
        <a class="btn" href="/">Continue Shopping</a>
      </div>
    </div>

    <script>
      const lastOrder = JSON.parse(localStorage.getItem('flipkart-last-order') || '{}');
      const customerName = lastOrder.customer?.name || 'Customer';
      const total = Number(lastOrder.total || 0);
      const discount = Number(lastOrder.discount || 0);
      const subtotal = Number(lastOrder.subtotal || total + discount || 0);
      document.getElementById('orderMeta').textContent = `${customerName}, your order total is ₹${total.toLocaleString('en-IN')} (subtotal ₹${subtotal.toLocaleString('en-IN')}, discount -₹${discount.toLocaleString('en-IN')}). We will contact you shortly.`;
    </script>
  </body>
</html>
