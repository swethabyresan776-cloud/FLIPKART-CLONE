<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | CartZone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Roboto', sans-serif; background: #f1f3f6; color: #212121; }
      .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .topbar { background: #2874f0; color: white; padding: 16px 0; }
      .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .logo { font-size: 2rem; font-weight: 700; letter-spacing: -0.06em; }
      .sub { font-size: 0.72rem; color: #ffe500; }
      .cart-layout { display: grid; grid-template-columns: 1.8fr 0.8fr; gap: 20px; margin-top: 24px; }
      .panel { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 20px; }
      .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #eee; }
      .item-details { display: flex; align-items: center; gap: 16px; }
      .item-details img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; }
      .price { font-weight: 700; font-size: 1.1rem; }
      .qty-controls { display: flex; align-items: center; gap: 8px; }
      .qty-controls button { border: 1px solid #ddd; background: #fff; width: 28px; height: 28px; cursor: pointer; border-radius: 4px; }
      .summary-box { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 20px; }
      .summary-row { display: flex; justify-content: space-between; margin: 12px 0; }
      .coupon-box { display: flex; gap: 8px; margin: 18px 0; }
      .coupon-box input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; }
      .coupon-box button { background: #2874f0; color: white; border: none; border-radius: 6px; padding: 10px 14px; cursor: pointer; }
      .coupon-box button.secondary { background: #f1f3f6; color: #212121; border: 1px solid #ddd; }
      .checkout-btn { width: 100%; background: #fb641b; color: white; border: none; border-radius: 4px; padding: 14px 20px; font-weight: 700; cursor: pointer; margin-top: 12px; }
      .empty-state { padding: 28px 0; color: #666; }
      a.back-link { color: #2874f0; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div>
          <div class="logo">CartZone</div>
          <div class="sub">Explore Plus</div>
        </div>
        <a href="/" style="color: white; font-weight: 700; text-decoration: none;">Back to Home</a>
      </div>
    </header>

    <div class="container">
      <div class="cart-layout">
        <div class="panel">
          <h2 style="margin-bottom: 14px;">My Cart</h2>
          <div id="cartItems"></div>
        </div>

        <aside class="summary-box">
          <h3>Price Details</h3>
          <div class="coupon-box">
            <input id="couponInput" type="text" placeholder="Enter coupon code" />
            <button id="applyCouponButton" type="button">Apply</button>
            <button id="removeCouponButton" type="button" class="secondary">Reset</button>
          </div>
          <div class="summary-row"><span>Price</span><span id="subtotal">₹0</span></div>
          <div class="summary-row"><span>Discount</span><span id="discount">-₹0</span></div>
          <div class="summary-row"><span>Delivery</span><span>Free</span></div>
          <div class="summary-row"><strong>Total</strong><strong id="total">₹0</strong></div>
          <button class="checkout-btn" id="checkoutButton" type="button">Place Order</button>
        </aside>
      </div>
    </div>

    <script>
      const CART_KEY = 'flipkart-cart';
      const COUPON_KEY = 'flipkart-coupon';

      const getCart = () => {
        try {
          return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        } catch (error) {
          return [];
        }
      };

      const saveCart = (cart) => {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
      };

      const getCoupon = () => {
        try {
          return JSON.parse(localStorage.getItem(COUPON_KEY) || 'null');
        } catch (error) {
          return null;
        }
      };

      const saveCoupon = (coupon) => {
        localStorage.setItem(COUPON_KEY, JSON.stringify(coupon));
      };

      const calculateDiscount = (subtotal) => {
        const coupon = getCoupon();
        if (!coupon || !coupon.code) return 0;

        const code = coupon.code.toUpperCase();
        if (code === 'FLIP10') return Math.round(subtotal * 0.1);
        if (code === 'SAVE20') return Math.round(subtotal * 0.2);
        if (code === 'NEWUSER') return Math.min(Math.round(subtotal * 0.15), 500);
        return 0;
      };

      const renderCart = () => {
        const cart = getCart();
        const cartItems = document.getElementById('cartItems');
        const subtotalEl = document.getElementById('subtotal');
        const discountEl = document.getElementById('discount');
        const totalEl = document.getElementById('total');
        const couponInput = document.getElementById('couponInput');
        const coupon = getCoupon();

        if (couponInput) {
          couponInput.value = coupon ? coupon.code : '';
        }

        if (!cart.length) {
          cartItems.innerHTML = '<div class="empty-state">Your cart is empty. <a href="/" class="back-link">Continue shopping</a></div>';
          subtotalEl.textContent = '₹0';
          discountEl.textContent = '-₹0';
          totalEl.textContent = '₹0';
          return;
        }

        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        const discount = calculateDiscount(subtotal);
        const total = subtotal - discount;

        cartItems.innerHTML = cart.map((item) => {
          const imgSrc = item.image && (item.image.startsWith('http') || item.image.startsWith('data:')) ? item.image : (item.image ? item.image : 'https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=300&q=80');
          return `
          <div class="cart-item">
            <div class="item-details">
              <img src="${imgSrc}" alt="${item.name}" />
              <div>
                <h4>${item.name}</h4>
                <div class="qty-controls">
                  <button data-action="decrease" data-id="${item.id}">-</button>
                  <span>${item.quantity}</span>
                  <button data-action="increase" data-id="${item.id}">+</button>
                </div>
              </div>
            </div>
            <div class="price">₹${(item.price * item.quantity).toLocaleString('en-IN')}</div>
          </div>
        `;
        }).join('');

        subtotalEl.textContent = `₹${subtotal.toLocaleString('en-IN')}`;
        discountEl.textContent = `-₹${discount.toLocaleString('en-IN')}`;
        totalEl.textContent = `₹${total.toLocaleString('en-IN')}`;

        document.querySelectorAll('[data-action]').forEach((button) => {
          button.addEventListener('click', () => {
            const id = Number(button.dataset.id);
            const action = button.dataset.action;
            const currentCart = getCart();
            const item = currentCart.find((entry) => entry.id === id);

            if (!item) return;

            if (action === 'increase') item.quantity += 1;
            if (action === 'decrease') item.quantity -= 1;

            const filteredCart = currentCart.filter((entry) => entry.quantity > 0);
            saveCart(filteredCart);
            renderCart();
          });
        });
      };

      document.getElementById('applyCouponButton')?.addEventListener('click', () => {
        const input = document.getElementById('couponInput');
        const code = (input?.value || '').trim();
        if (!code) {
          alert('Enter a coupon code first.');
          return;
        }

        const validCodes = ['FLIP10', 'SAVE20', 'NEWUSER'];
        const normalized = code.toUpperCase();
        if (!validCodes.includes(normalized)) {
          alert('Invalid coupon code. Try FLIP10, SAVE20, or NEWUSER.');
          return;
        }

        saveCoupon({ code: normalized });
        renderCart();
      });

      document.getElementById('removeCouponButton')?.addEventListener('click', () => {
        localStorage.removeItem(COUPON_KEY);
        const input = document.getElementById('couponInput');
        if (input) input.value = '';
        renderCart();
      });

      document.getElementById('checkoutButton')?.addEventListener('click', () => {
        const cart = getCart();
        if (!cart.length) {
          alert('Your cart is empty.');
          return;
        }

        const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        localStorage.setItem('flipkart-order-meta', JSON.stringify({
          subtotal,
          discount: calculateDiscount(subtotal),
          total: subtotal - calculateDiscount(subtotal)
        }));
        window.location.href = '/checkout.html';
      });

      renderCart();
    </script>
  </body>
</html>
